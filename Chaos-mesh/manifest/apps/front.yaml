apiVersion: v1
kind: ConfigMap
metadata:
  name: front-nginx
data:
  default.conf: |
    server {
      listen 80;
      location / {
        proxy_pass http://api.chaos-demo.svc.cluster.local/;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: front
  labels:
    app: front
spec:
  replicas: 2
  selector:
    matchLabels:
      app: front
  template:
    metadata:
      labels:
        app: front
    spec:
      containers:
      - name: nginx
        image: nginx:1.25
        ports:
        - containerPort: 80
        volumeMounts:
        - name: cfg
          mountPath: /etc/nginx/conf.d
      volumes:
      - name: cfg
        configMap:
          name: front-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: front
spec:
  selector:
    app: front
  ports:
  - name: http
    port: 80
    targetPort: 80
